appId: com.felipeaguiar.gridiron-manager
productName: Gridiron Manager
directories:
  buildResources: build
  output: dist
files:
  - out/**
extraResources:
  - from: resources/migrations
    to: migrations
  - from: resources/seed
    to: seed
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: true
